[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend", "."]
testpaths = ["backend", "frontend/tests", "stream_processing", "shared"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["EXE"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "analytics", "assistant", "config", "core", "emissions", "frontend", "shared", "stream_processing"]
